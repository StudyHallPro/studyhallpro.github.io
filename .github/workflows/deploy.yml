name: Inject Scrambler and Deploy

on:
  push:
    branches: ["main"] # Change to "master" if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # ADDED: Required environment configuration for GitHub Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject scrambler.js into all HTML files
        run: |
          find . -name "*.html" -exec sed -i 's|</head>|<script src="/scrambler.js"></script></head>|gi' {} +

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          # ADDED: Exclude large unnecessary folders to stay well under the 1 GB limit
          exclude: |
            .git/
            node_modules/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
